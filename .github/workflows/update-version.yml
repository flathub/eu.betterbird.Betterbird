# This workflow checks for new tags in Betterbird/thunderbird-patches and runs
# update-version.py --auto if there is a new tag for the configured major
# release. It prepares the update on the develop branch and creates a PR that
# merges develop into master.

name: update-version

on:
  #schedule:
  #  - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      # Use the pixi environment so update-version.py runs with exactly the
      # same dependencies as local development, in particular the ruamel.yaml
      # version pinned in pixi.toml (matching flatpak-external-data-checker).
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
          cache: true

      - name: Auto-update to newest tag
        run: pixi run python update-version.py --auto 153 --base develop --target master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
